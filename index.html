<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Pong - Modern Arcade Classic</title>
    
    <!-- Primary Meta Tags -->
    <meta name="title" content="Retro Pong - Modern Arcade Classic">
    <meta name="description" content="Play Retro Pong! A sleek, modern recreation of the classic arcade game with dynamic particles, mutators, and responsive mobile touch controls. Can you beat the CPU?">
    <meta name="keywords" content="pong, retro game, browser game, arcade, html5 canvas, javascript game, neon pong, free online game">
    <meta name="author" content="Aldo Tobing">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0f172a">
    <meta name="google-site-verification" content="FOi8yHeDmxBlTyve7YP90ShIXTiHAxI3ZWyNjKtUhtw" />

    <!-- Open Graph / Facebook / Discord / iMessage -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://retropong.vercel.app/">
    <meta property="og:title" content="Retro Pong - Modern Arcade Classic">
    <meta property="og:description" content="Experience Retro Pong with stunning neon graphics, particle effects, and silky smooth gameplay on both mobile and desktop. Play for free in your browser.">
    <meta property="og:image" content="https://retropong.vercel.app/og-image.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://retropong.vercel.app/">
    <meta property="twitter:title" content="Retro Pong - Modern Arcade Classic">
    <meta property="twitter:description" content="Experience Retro Pong with stunning neon graphics, particle effects, and silky smooth gameplay on both mobile and desktop. Play for free in your browser.">
    <meta property="twitter:image" content="https://retropong.vercel.app/og-image.png">
    <meta property="twitter:creator" content="@aldo_tobing">

    <link rel="stylesheet" href="./style.css">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    
    <div class="game-wrapper">
        <header>
            <div class="scoreboard">
                <div class="score-section player">
                    <div class="label">PLAYER</div>
                    <div id="playerScore" class="score">0</div>
                </div>
                <div class="divider"></div>
                <div class="score-section computer">
                    <div id="computerScore" class="score">0</div>
                    <div class="label">CPU</div>
                </div>
            </div>
        </header>
        <div class="canvas-container" style="position: relative;">
            <canvas id="gameCanvas" width="800" height="600"></canvas>
            
            <div id="gameOverUi" class="game-over-ui" style="display: none;">
                <button id="tweetShare" class="tweet-share-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                    X / Twitter
                </button>
                <button id="igShare" class="ig-share-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                    IG Story
                </button>
            </div>

            <div id="mobileHint" class="mobile-hint">
                <span>💡 Tip: Use Touch or Mouse dragging for best mobile experience</span>
                <button class="close-hint" onclick="document.getElementById('mobileHint').style.display='none'">✕</button>
            </div>
        </div>
        <footer id="appFooter" class="app-footer" style="display: none;">
            Created by <a href="https://twitter.com/aldo_tobing" target="_blank">@aldo_tobing</a>
        </footer>
    </div>
    <script type="module" src="./script.js"></script>
</body>
</html>
